version: '3.8'

services:
  # Servidor web Nginx
  nginx:
    image: nginx:alpine
    container_name: modelo_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - /etc/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - desarrollo
    restart: unless-stopped

  # Aplicación Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modelo_app
    volumes:
      - ./:/var/www
      - /etc/nginx/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - desarrollo
    restart: unless-stopped

  # Base de datos MySQL
  services:
    mysql:
      image: mysql:8.0
      container_name: mysql
      restart: unless-stopped
      environment:
        MYSQL_DATABASE: modelo_db
        MYSQL_ROOT_PASSWORD: fred027a
        MYSQL_PASSWORD: fred027a
        MYSQL_USER: fredy
        SERVICE_TAGS: dev
        SERVICE_NAME: mysql
      ports:
        - "3306:3306"
      volumes:
        - mysql_data:/var/lib/mysql
      networks:
        - desarrollo



volumes:
  mysql_data:

networks:
  desarrollo:
    external: true